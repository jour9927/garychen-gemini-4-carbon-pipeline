[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garychen-gemini4-carbon"
version = "4.0.0"
description = "Garychen (@garychenai) V4 Studio Unattended Long + Pure-Remotion Shorts Production Pipeline (Multi-Year SEC/GitHub Crawler + Two-Stage Scriptwriter + Qwen3-TTS Taiwanese Voice Cloning + Studio Foley + 60fps Remotion Motion Engine)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "yt-dlp>=2026.11.0",
    "json-repair>=0.30.0",
    "playwright>=1.45.0",
    "huggingface-hub>=0.34.0,<1.0",
    "diffusers>=0.32.0,<0.36.0",
]

[project.scripts]
garychen-run = "garychen_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
